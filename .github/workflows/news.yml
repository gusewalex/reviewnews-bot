name: WordPress news bot

on:
  schedule:
    - cron: "*/30 * * * *"   # кожні 30 хвилин
  workflow_dispatch:          # дозволяє запускати вручну кнопкою

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run bot
        env:
          WP_URL: ${{ secrets.WP_URL }}
          WP_USER: ${{ secrets.WP_USER }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          POST_STATUS: publish   # змініть на publish, коли будете впевнені в якості
          MAX_POSTS: "3"
        run: python main.py

      - name: Save list of processed news
        run: |
          git config user.name "news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          git add seen.json
          git diff --staged --quiet || (git commit -m "update seen list" && git push)
