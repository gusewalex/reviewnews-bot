name: WordPress news bot

on:
  schedule:
    - cron: "17,47 * * * *"  # запасний запуск (поза «піковими» хвилинами GitHub)
  workflow_dispatch:         # ручний запуск кнопкою; також так бот запускає сам себе
    inputs:
      mark_only:
        description: "Лише позначити всі поточні новини як оброблені (без публікації)"
        type: boolean
        default: false

permissions:
  contents: write
  actions: write             # щоб бот міг запустити наступний запуск

concurrency:
  group: news-bot
  cancel-in-progress: false  # наступний запуск чекає завершення попереднього

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run bot
        env:
          WP_URL: ${{ secrets.WP_URL }}
          WP_USER: ${{ secrets.WP_USER }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          POST_STATUS: publish        # publish = одразу на сайт, draft = у чернетки
          MAX_POSTS: "10"             # скільки нових новин за одну перевірку
          MAX_ENTRIES: "60"           # скільки останніх новин читати зі стрічки
          MAX_AGE_HOURS: "6"          # новини старші за 6 годин не публікуються
          RUN_LOOP_MINUTES: "55"      # бот працює безперервно 55 хв, перевіряючи стрічку кожні 4 хв
          POLL_SECONDS: "240"
          MARK_SEEN_ONLY: ${{ inputs.mark_only }}
        run: python main.py

      - name: Save list of processed news
        if: always()                  # зберігаємо список навіть якщо запуск завершився помилкою
        run: python save_seen.py

      - name: Start next run
        if: always()                  # бот сам запускає наступний запуск: без пауз між ними
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run news.yml --ref ${{ github.ref_name }}
