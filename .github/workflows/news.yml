name: WordPress news bot

on:
  schedule:
    - cron: "*/10 * * * *"   # GitHub запускає перевірку приблизно кожні 10 хвилин
  workflow_dispatch:         # дозволяє запускати вручну кнопкою
    inputs:
      mark_only:
        description: "Лише позначити всі поточні новини як оброблені (без публікації)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: news-bot
  cancel-in-progress: false  # наступний запуск чекає завершення попереднього

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run bot
        env:
          WP_URL: ${{ secrets.WP_URL }}
          WP_USER: ${{ secrets.WP_USER }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          POST_STATUS: publish        # publish = одразу на сайт, draft = у чернетки
          MAX_POSTS: "30"             # скільки нових новин за одну перевірку
          MAX_ENTRIES: "60"           # скільки останніх новин читати зі стрічки
          RUN_LOOP_MINUTES: "30"      # бот працює безперервно 30 хв, перевіряючи стрічку кожні 4 хв (0 = одна перевірка)
          POLL_SECONDS: "240"
          MARK_SEEN_ONLY: ${{ inputs.mark_only }}
        run: python main.py

      - name: Save list of processed news
        if: always()                  # зберігаємо список навіть якщо запуск завершився помилкою
        run: python save_seen.py
