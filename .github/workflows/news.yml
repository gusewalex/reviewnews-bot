name: WordPress news bot

on:
  schedule:
    - cron: "*/5 * * * *"   # кожні 5 хвилин
  workflow_dispatch:         # дозволяє запускати вручну кнопкою

permissions:
  contents: write

concurrency:
  group: news-bot
  cancel-in-progress: false  # наступний запуск чекає завершення попереднього

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run bot
        env:
          WP_URL: ${{ secrets.WP_URL }}
          WP_USER: ${{ secrets.WP_USER }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          POST_STATUS: publish   # publish = одразу на сайт, draft = у чернетки
          MAX_POSTS: "30"        # скільки нових новин за один запуск
          MAX_ENTRIES: "60"      # скільки останніх новин читати з кожної стрічки
        run: python main.py

      - name: Save list of processed news
        if: always()             # зберігаємо список навіть якщо запуск завершився помилкою
        run: |
          git config user.name "news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          cp seen.json /tmp/mine.json 2>/dev/null || echo "[]" > /tmp/mine.json
          for i in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            python - <<'PY'
          import json

          def load(path):
              try:
                  with open(path, encoding="utf-8") as f:
                      return json.load(f)
              except Exception:
                  return []

          merged = list(dict.fromkeys(load("seen.json") + load("/tmp/mine.json")))[-2000:]
          with open("seen.json", "w", encoding="utf-8") as f:
              json.dump(merged, f, ensure_ascii=False, indent=1)
          PY
            git add seen.json
            if git diff --staged --quiet; then
              break
            fi
            git commit -m "update seen list"
            if git push origin HEAD:main; then
              break
            fi
            sleep 5
          done
